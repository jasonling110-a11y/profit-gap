name: 利润断层每日扫描

# 触发方式：
#   1) 定时：每个工作日（周一~周五）北京时间 22:00 = UTC 14:00。
#      A 股公告绝大多数在盘后 16:00~21:00 发布，22:00 能覆盖完当天全部盘后公告。
#   2) 手动：在仓库 Actions 页点「Run workflow」，用于首次连通性测试。
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write          # 允许把生成结果提交回仓库

concurrency:
  group: profit-gap-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # 云端 runner 只有 4 核，且跨境访问东财/新浪比国内慢很多（实测整轮约 40~45 分钟，
    # 本地只要 1.5 分钟）。留足余量，别让 job 超时把跑了 40 分钟的结果丢掉。
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --no-cache-dir -r requirements.txt

      # 扫描：退出码非 0（数据完整性检查未通过）会让本步骤失败 → 不提交、不发布，
      # 保住上一版已知完好的页面，而不是用一份可能漏票的清单覆盖它。
      - name: 扫描利润断层
        run: python src/profit_gap.py --workers 4

      - name: 重建看板
        run: python src/build_workbench.py

      - name: 完整性审计
        run: python tools/audit_pipeline.py

      # 投资日历 / 聚合页。与主看板解耦：日历抓取失败也照样重建聚合页
      # （问题会显示在页面上的提示条里），不会因可选数据源挂掉就不产出首页。
      - name: 抓取投资日历事件
        run: python src/calendar_events.py

      - name: 生成聚合页
        run: python src/build_home.py

      # GitHub Pages 站点入口：首页 = 聚合页（投资日历 + 断层选股平台），
      # 完整看板（K 线 / 散点图 / 板块全景）留在 利润断层工作台.html，由首页显眼入口跳转。
      # 注：实测 Pages **能**正常服务中文文件名（HTTP 200），中文名链接可用；
      #     index.html / home.html 只是站点根入口与便于分享的短链。
      - name: 生成站点入口
        run: |
          cp 个人投资工作台.html index.html
          cp 利润断层工作台.html dashboard.html

      # 产物校验：脚本退出码为 0 不代表页面有内容（数据源整批为空也能「成功」生成空页）。
      - name: 校验产物非空
        run: python tools/verify_outputs.py

      # 结果落盘：把本轮关键结论写成文件一起提交。
      # 2026-10-04 踩过 GitHub 日志存储故障（Azure 返回 InvalidAuthenticationInfo），
      # Actions 日志可能读不出来，所以摘要必须落在仓库文件里，不能只依赖日志。
      - name: 记录运行摘要
        if: always()
        run: |
          echo "UTC $(date -u +%Y-%m-%dT%H:%M:%SZ) / 北京 $(TZ=Asia/Shanghai date +%F\ %T)"  > data/last_cloud_run.txt
          echo "run_number ${{ github.run_number }}  event ${{ github.event_name }}"      >> data/last_cloud_run.txt
          echo "--- summary ---"                                                          >> data/last_cloud_run.txt
          python tools/cloud_summary.py >> data/last_cloud_run.txt 2>&1 || echo "(摘要生成失败)" >> data/last_cloud_run.txt

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
          else
            git commit -m "chore: 利润断层每日扫描 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            # 整轮要跑 40+ 分钟，期间 main 完全可能被别的提交推进（手动触发、诊断提交等）。
            # 不 rebase 直接 push 会被 non-fast-forward 拒绝，白跑一轮。
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "第 $i 次推送失败，5 秒后重试…"; sleep 5
            done
            git push origin main
          fi
