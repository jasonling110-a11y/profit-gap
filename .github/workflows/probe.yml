name: 连通性探测
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pip install -q akshare==1.18.64 mini-racer==0.14.1 pandas==2.2.3 requests==2.32.3 lxml beautifulsoup4 tqdm
      - name: 运行探测
        continue-on-error: true
        run: python tools/cloud_probe.py 2>&1 | tee probe_result.txt
      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe_result.txt
          git commit -m "探测结果 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "无变化"
          git push
